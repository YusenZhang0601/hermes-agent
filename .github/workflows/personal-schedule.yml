name: Maintain personal Hermes

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate the cloud update path without publishing an application update
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    uses: YusenZhang0601/hermes-agent/.github/workflows/personal-sync.yml@b0c1a7776ea310d146e8eb928b0d922dbf07d4ea
    with:
      verify_only: ${{ inputs.verify_only || false }}
    secrets:
      HERMES_SYNC_DEPLOY_KEY: ${{ secrets.HERMES_SYNC_DEPLOY_KEY }}
